<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minigolf-Buch — Golf With Your Friends</title>
<style>
  :root {
    --green-deep:#103026; --green-mid:#1B4636; --green-line:#2C5C48;
    --chalk:#EDF1E8; --chalk-dim:#A9BBAE; --amber:#E3A33C; --brick:#B4544A; --fairway:#5FA36B;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums; background:var(--green-deep); color:var(--chalk); line-height:1.45;
  }
  .wrap { max-width:1000px; margin:0 auto; padding:22px 16px 70px; }
  h1 { font-size:26px; font-weight:600; letter-spacing:-.02em; margin:0 0 2px; }
  .sub { color:var(--chalk-dim); font-size:13px; margin:0 0 20px; }
  h2 { font-size:17px; font-weight:600; margin:26px 0 10px; }
  h3 { font-size:14px; font-weight:600; margin:18px 0 6px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:18px; }
  nav button {
    background:transparent; color:var(--chalk-dim); border:1px solid var(--green-line);
    border-radius:2px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  nav button:hover { color:var(--chalk); }
  nav button[aria-current="true"] { background:var(--green-mid); color:var(--chalk); border-color:var(--fairway); }
  nav button:focus-visible, .maprow:focus-visible, .back:focus-visible, .maplink:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  .scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px; }
  table { border-collapse:collapse; font-size:13px; width:100%; }
  th,td { padding:6px 8px; text-align:right; border-bottom:1px solid var(--green-line); white-space:nowrap; }
  th { color:var(--chalk-dim); font-weight:500; font-size:12px; }
  th:first-child, td:first-child { text-align:left; }
  tr.me td { color:var(--amber); }
  .win { color:var(--fairway); } .loss { color:var(--brick); } .muted { color:var(--chalk-dim); }
  caption { text-align:left; font-size:13px; color:var(--chalk-dim); padding-bottom:6px; }
  .matrix td,.matrix th { text-align:center; }
  .matrix th:first-child { text-align:left; }
  .matrix td.self { background:var(--green-mid); color:var(--chalk-dim); }
  a { color:var(--fairway); } a:hover { color:var(--chalk); }
  .maprow {
    display:flex; justify-content:space-between; align-items:baseline; gap:10px; width:100%;
    text-align:left; background:transparent; color:var(--chalk); border:0;
    border-bottom:1px solid var(--green-line); padding:11px 2px; font-family:inherit; font-size:15px; cursor:pointer;
  }
  .maprow:hover { background:var(--green-mid); }
  .maprow .meta { font-size:12px; color:var(--chalk-dim); white-space:nowrap; }
  .maprow .name { font-weight:500; }
  .unplayed .name { color:var(--chalk-dim); }
  .maplink { background:transparent; border:0; padding:0; font-family:inherit; font-size:13px;
    color:var(--fairway); cursor:pointer; text-align:left; }
  .maplink:hover { color:var(--chalk); text-decoration:underline; }
  .note,.hint { font-size:12px; color:var(--chalk-dim); margin-top:4px; }
  .empty { color:var(--chalk-dim); font-size:13px; padding:16px 0; }
  .grade { font-size:12px; color:var(--chalk-dim); }
  .back { background:transparent; border:0; color:var(--chalk-dim); font-family:inherit; font-size:13px; cursor:pointer; padding:0 0 10px; }
  .back:hover { color:var(--chalk); }
  .avatar { width:22px; height:22px; border-radius:50%; vertical-align:-5px; margin-right:7px; border:1px solid var(--green-line); }
  .toggleall { background:transparent; border:1px solid var(--green-line); border-radius:2px;
    color:var(--chalk-dim); font-family:inherit; font-size:11px; font-weight:400;
    padding:3px 9px; margin-left:10px; cursor:pointer; vertical-align:2px; }
  .toggleall:hover { color:var(--chalk); }
  .pcard { border:1px solid var(--green-line); border-radius:4px; margin-bottom:8px; overflow:hidden; }
  .pcard[open] { background:rgba(27,70,54,.35); }
  .pcard.pme { border-color:var(--amber); }
  .pcard summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .pcard summary::-webkit-details-marker { display:none; }
  .pcard summary:hover { background:var(--green-mid); }
  .pcard summary:focus-visible { outline:2px solid var(--amber); outline-offset:-2px; }
  .prank { font-size:13px; color:var(--chalk-dim); min-width:16px; }
  .pav { width:46px; height:46px; border-radius:6px; border:1px solid var(--green-line); flex:none; }
  .pav-none { background:var(--green-mid); display:inline-block; }
  .pname { font-size:19px; font-weight:600; letter-spacing:-.01em; display:flex; flex-direction:column; }
  .pme .pname { color:var(--amber); }
  .pname-ig { font-size:12px; font-weight:400; color:var(--chalk-dim); letter-spacing:0; }
  .psum { margin-left:auto; font-size:12px; color:var(--chalk-dim); white-space:nowrap; }
  .stats { display:flex; flex-wrap:wrap; gap:10px 22px; padding:4px 14px 14px; }
  .stat { display:flex; flex-direction:column; }
  .stat .sv { font-size:17px; font-weight:600; }
  .stat .sl { font-size:11px; color:var(--chalk-dim); }
  .pcard .scroll { margin:0; padding:0 14px 14px; }
  figure { margin:12px 0 0; }
  figure img { width:100%; height:auto; border:1px solid var(--green-line); border-radius:3px; display:block; }
  figcaption { font-size:12px; color:var(--chalk-dim); margin-top:5px; }
  .ro { display:inline-block; font-size:11px; color:var(--chalk-dim); border:1px solid var(--green-line);
    border-radius:2px; padding:2px 7px; margin-left:8px; vertical-align:middle; }
  .holes th:first-child, .holes td:first-child { position:sticky; left:0; z-index:1; background:var(--green-deep); box-shadow:1px 0 0 var(--green-line); }
  .scroll.flush { margin:0; padding:0; }
  tr.day td { padding:14px 2px 3px; font-size:11px; color:var(--chalk-dim); border-bottom:0; letter-spacing:.02em; }
  tbody tr.day:first-child td { padding-top:4px; }
  .sortbar { display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:12px; color:var(--chalk-dim); margin:-4px 0 6px; }
  .sortbar button { background:transparent; border:1px solid transparent; border-radius:2px; color:var(--chalk-dim);
    font-family:inherit; font-size:12px; padding:3px 8px; cursor:pointer; }
  .sortbar button:hover { color:var(--chalk); }
  .sortbar button[aria-pressed="true"] { color:var(--chalk); border-color:var(--green-line); }
  .sortbar button:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--chalk-dim); margin:4px 0 6px; }
  .legend i, .tip i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .chart { position:relative; overflow:hidden; }
  .chart svg { display:block; touch-action:pan-y; }
  .chart .grid { stroke:var(--green-line); stroke-width:1; }
  .chart .tick { fill:var(--chalk-dim); font-size:11px; }
  .chart .endlab { fill:var(--chalk); font-size:11px; }
  .chart .dot { stroke:var(--green-deep); stroke-width:2; }
  .chart .xhair { stroke:var(--chalk-dim); stroke-width:1; stroke-dasharray:3 3; }
  .tip { position:absolute; top:6px; background:var(--green-mid); border:1px solid var(--green-line); border-radius:3px;
    padding:6px 9px; font-size:12px; pointer-events:none; min-width:120px; }
  .tip div { display:flex; align-items:center; gap:2px; }
  .tip div span { margin-left:auto; padding-left:12px; }
  .charttitle { font-size:12px; color:var(--chalk-dim); margin:14px 0 0; }
  .bars { display:flex; flex-direction:column; gap:6px; margin:6px 0 4px; }
  .brow { display:flex; align-items:center; gap:10px; font-size:13px; }
  .brow.me .bname { color:var(--amber); }
  .bname { width:92px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar { flex:1; display:flex; gap:2px; height:14px; }
  .bar span { min-width:2px; }
  .bar span:first-child { border-radius:3px 0 0 3px; } .bar span:last-child { border-radius:0 3px 3px 0; }
  .bn { width:34px; flex:none; text-align:right; font-size:11px; color:var(--chalk-dim); }
  .tview summary { font-size:12px; color:var(--chalk-dim); cursor:pointer; margin:6px 0; }
  .duelpick { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 8px; font-size:13px; color:var(--chalk-dim); }
  .duelpick select { background:var(--green-mid); color:var(--chalk); border:1px solid var(--green-line); border-radius:2px;
    font-family:inherit; font-size:14px; padding:6px 8px; }
  .duelpick select:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  .duelsum { font-size:13px; color:var(--chalk-dim); margin:0 0 6px; }
  table.duel td:not(:first-child), table.duel th:not(:first-child) { width:28%; }
  td.pick { cursor:pointer; } td.pick:hover { background:var(--green-mid); }
  .err { border:1px solid var(--brick); border-radius:3px; padding:12px 14px; color:var(--chalk); font-size:13px; }
</style>
</head>
<body>
<div class="wrap"><div id="root"><p class="muted">Lade Daten…</p></div></div>

<script>
let DATA = null, MATCHES = [], MAPS = {}, PLAYERS = {};
let ME = 'Ich';
let tab = 'matches', openMap = null, mapSort = 'az', duelA = null, duelB = null;

// Adresse im Browser: #runden, #duelle, #maps, #maps/<Map-Name>, #spieler
const SLUGS = { matches:'runden', duels:'duelle', maps:'maps', players:'spieler', stats:'statistik' };
function go(t, map, pair) {
  location.hash = map ? 'maps/' + encodeURIComponent(map)
    : pair ? 'duelle/' + pair.map(encodeURIComponent).join('/') : SLUGS[t];
}
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('maps/')) {
    tab = 'maps';
    openMap = mapNames().includes(h.slice(5)) ? h.slice(5) : null;
    return;
  }
  if (h.startsWith('duelle/')) {
    tab = 'duels'; openMap = null;
    [duelA, duelB] = location.hash.slice(8).split('/').map(decodeURIComponent);
    return;
  }
  tab = Object.keys(SLUGS).find(k => SLUGS[k] === h) || 'matches';
  openMap = null;
}

const sum = a => a.reduce((x,y)=>x+y,0);
const adjOf = (m,p) => (m.adjust && m.adjust[p]) ? m.adjust[p] : 0;
const totalOf = (m,p) => (m.scores && m.scores[p]) ? sum(m.scores[p]) + adjOf(m,p)
  : ((m.totals && m.totals[p] != null) ? m.totals[p] + adjOf(m,p) : null);
const playersOf = m => {
  const s = new Set(Object.keys(m.scores || m.totals || {}));
  (m.order || []).forEach(g => g.forEach(p => s.add(p)));
  return [...s];
};
const parTotal = m => m.par ? sum(m.par) : (m.parTotal != null ? m.parTotal : null);
const fmt = (n,d=2) => (n>=0?'+':'') + n.toFixed(d);
const fmtInt = n => (n>0?'+':n<0?'':'±') + n;
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const isBot = p => !!(PLAYERS[p] && PLAYERS[p].bot);

function rankOf(m,p) {
  if (!m.order) return null;
  const i = m.order.findIndex(g => g.includes(p));
  return i < 0 ? null : i;
}
// Alle Spieler auf Platz 1; bei Gleichstand an der Spitze mehrere
function winnersOf(m) {
  if (m.winner) return [m.winner];
  if (m.order) return m.order[0];
  const sc = playersOf(m).map(p => [p, totalOf(m,p)]).filter(x => x[1] != null);
  if (!sc.length) return [];
  const best = Math.min(...sc.map(x => x[1]));
  return sc.filter(x => x[1] === best).map(x => x[0]);
}
const winList = m => winnersOf(m).map(p => '<span class="win">'+esc(p)+'</span>').join(' & ');
function placeOf(m,p) {
  const ps = playersOf(m);
  if (!ps.includes(p)) return null;
  const vals = ps.map(x => [x, totalOf(m,x)]).filter(x => x[1] != null);
  if (vals.length === ps.length) {
    const t = totalOf(m,p);
    return vals.filter(x => x[1] < t).length + 1;
  }
  const r = rankOf(m,p);
  if (r != null) { let pl = 1; for (let i = 0; i < r; i++) pl += m.order[i].length; return pl; }
  if (m.winner && ps.length === 2) return m.winner === p ? 1 : 2;
  return null;
}
function holeStats(m,p) {
  if (!m.scores || !m.scores[p] || !m.par) return null;
  const d = m.scores[p].map((s,i) => s - m.par[i]);
  const mean = sum(d)/d.length;
  const sd = Math.sqrt(sum(d.map(x => (x-mean)**2))/d.length);
  const worst = Math.max(...d);
  return { toPar:sum(d), mean, sd, underOrPar:d.filter(x=>x<=0).length, worst, worstHole:d.indexOf(worst)+1, holes:d.length };
}
// Gegnerbereinigte Stärke (Bradley-Terry, Minorization-Maximization).
// Ein Sieg gegen einen starken Gegner zählt mehr als einer gegen einen schwachen,
// dadurch verzerrt es nicht, wenn jemand fast immer gegen den Besten spielt.
let RATING = null;
function pairPlace(m,p,a,b) {
  const ta = totalOf(m,a), tb = totalOf(m,b);
  if (ta != null && tb != null) return ta === tb ? null : (p === a ? (ta < tb ? 1 : 2) : (tb < ta ? 1 : 2));
  const ra = rankOf(m,a), rb = rankOf(m,b);
  if (ra != null && rb != null) return ra === rb ? null : (p === a ? (ra < rb ? 1 : 2) : (rb < ra ? 1 : 2));
  if (m.winner === a || m.winner === b) return m.winner === p ? 1 : 2;
  return null;
}
function computeRating(matches) {
  const ps = [...new Set(matches.flatMap(playersOf))];
  const W = {}; ps.forEach(p => W[p] = {});
  matches.forEach(m => {
    const f = playersOf(m);
    for (let i = 0; i < f.length; i++) for (let j = i+1; j < f.length; j++) {
      const a = f[i], b = f[j], pa = pairPlace(m,a,a,b);
      if (pa == null) continue;
      const w = pa === 1 ? a : b, l = pa === 1 ? b : a;
      W[w][l] = (W[w][l]||0) + 1;
      if (W[l][w] == null) W[l][w] = 0;
    }
  });
  let S = {}; ps.forEach(p => S[p] = 1);
  for (let it = 0; it < 400; it++) {
    const next = {};
    ps.forEach(p => {
      const wins = sum(Object.values(W[p])) + 0.5;     // halber virtueller Sieg als Dämpfung
      let den = 0.5 / (S[p] + 1);
      Object.keys(W[p]).forEach(q => {
        const n = (W[p][q]||0) + (W[q][p]||0);
        if (n) den += n / (S[p] + S[q]);
      });
      next[p] = den > 0 ? wins/den : S[p];
    });
    const g = Math.exp(sum(ps.map(p => Math.log(next[p])))/ps.length);
    ps.forEach(p => S[p] = next[p]/g);
  }
  return S;
}
const ratingOf = p => (RATING && RATING[p] != null) ? RATING[p] : 0;
function roundCount(p) { return MATCHES.filter(m => playersOf(m).includes(p)).length; }
function allPlayers() {
  const s = new Set();
  MATCHES.forEach(m => playersOf(m).forEach(p => s.add(p)));
  Object.values(MAPS).forEach(x => Object.keys(x.grades||{}).forEach(p => s.add(p)));
  return [...s].sort((a,b) => {
    if (a === ME) return -1;          // eigener Eintrag immer zuerst
    if (b === ME) return 1;
    const d = ratingOf(b) - ratingOf(a);
    if (Math.abs(d) > 1e-9) return d;
    return roundCount(b) - roundCount(a);
  });
}
function duel(a,b) {
  let aw=0, bw=0, played=0, diff=0, diffN=0;
  MATCHES.forEach(m => {
    const ps = playersOf(m);
    if (!ps.includes(a) || !ps.includes(b)) return;
    played++;
    const ta = totalOf(m,a), tb = totalOf(m,b);
    if (ta != null && tb != null) {
      diff += ta - tb; diffN++;
      if (ta < tb) aw++; else if (tb < ta) bw++;
      return;
    }
    const ra = rankOf(m,a), rb = rankOf(m,b);
    if (ra != null && rb != null) { if (ra < rb) aw++; else if (rb < ra) bw++; return; }
    if (m.winner === a) aw++; else if (m.winner === b) bw++;
  });
  return { played, aw, bw, avgDiff: diffN ? diff/diffN : null };
}
function strokeDuel(a,b) {
  let sa=0, sb=0, n=0;
  MATCHES.forEach(m => {
    const ps = playersOf(m);
    if (!ps.includes(a) || !ps.includes(b)) return;
    const ta = totalOf(m,a), tb = totalOf(m,b);
    if (ta == null || tb == null) return;       // Runden ohne Zahlen bleiben außen vor
    sa += ta; sb += tb; n++;
  });
  return { sa, sb, n, diff: sa - sb };
}
function mapNames() {
  const s = new Set(Object.keys(MAPS));
  MATCHES.forEach(m => s.add(m.map));
  return [...s].sort((a,b) => a.localeCompare(b,'de'));
}
const roundsOf = n => MATCHES.filter(m => m.map === n);
const mapInfo = n => MAPS[n] || {};

/* ---------- Runden ---------- */
const WEEKDAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
function dayLabel(iso) {
  const [y,mo,d] = iso.split('-').map(Number);
  return WEEKDAYS[new Date(y, mo-1, d).getDay()] + ' ' + String(d).padStart(2,'0') + '.' + String(mo).padStart(2,'0') + '.';
}
function viewMatches() {
  // Neueste zuerst, mit einer unauffälligen Zeile pro Spieltag
  let lastDate = null;
  const rows = MATCHES.slice().reverse().map(m => {
    let head = '';
    if (m.date !== lastDate) {
      lastDate = m.date;
      const n = MATCHES.filter(x => x.date === m.date).length;
      head = '<tr class="day"><td colspan="4">' + dayLabel(m.date) + ' · ' + n + ' Runde' + (n>1?'n':'') + '</td></tr>';
    }
    const w = winnersOf(m), pt = parTotal(m);
    const cells = playersOf(m).map(p => {
      const t = totalOf(m,p);
      return '<span class="' + (w.includes(p)?'win':'') + '">' + esc(p) + ' ' + (t==null?'–':t) + '</span>';
    }).join(' · ');
    const short = m.note ? (m.note.length > 46 ? m.note.slice(0,44) + '…' : m.note) : '';
    return head + '<tr><td><button class="maplink" data-map="' + esc(m.map) + '">' + esc(m.map) + '</button>' +
      (short ? '<div class="note">' + esc(short) + '</div>' : '') + '</td>' +
      '<td class="muted">' + (pt==null?'–':pt) + '</td>' +
      '<td style="text-align:left">' + cells + '</td>' +
      '<td>' + (w.length ? winList(m) : '<span class="muted">offen</span>') + '</td></tr>';
  }).join('');
  return '<h2>Runden</h2><div class="scroll"><table><thead><tr><th>Map</th><th>Par</th><th>Ergebnisse</th><th>Sieger</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
    '<p class="note">Auf den Map-Namen tippen für Screenshot, Loch-für-Loch-Karte und die vollständige Notiz.</p>';
}

/* ---------- Duell-Vergleich ---------- */
// Nur Runden, in denen beide dabei waren: gleiche Maps, andere Mitspieler zählen nicht
function duelPair() {
  const ps = allPlayers().filter(p => roundCount(p) > 0);
  let a = ps.includes(duelA) ? duelA : ME;
  const common = q => MATCHES.filter(m => playersOf(m).includes(a) && playersOf(m).includes(q)).length;
  let b = ps.includes(duelB) && duelB !== a ? duelB
    : ps.filter(p => p !== a).sort((x, y) => common(y) - common(x))[0];
  return [a, b, ps];
}

function viewDuelCompare() {
  const [a, b, ps] = duelPair();
  const pick = (id, sel) => '<select id="'+id+'" aria-label="Spieler">' + ps.map(p =>
    '<option'+(p===sel?' selected':'')+'>'+esc(p)+'</option>').join('') + '</select>';
  const head = '<div class="duelpick">'+pick('duel-a', a)+'<span>gegen</span>'+pick('duel-b', b)+'</div>';
  if (!b || a === b) return '<h2>Duell-Vergleich</h2>' + head + '<p class="empty">Zwei verschiedene Spieler wählen.</p>';

  const rs = MATCHES.filter(m => playersOf(m).includes(a) && playersOf(m).includes(b));
  if (!rs.length) return '<h2>Duell-Vergleich</h2>' + head + '<p class="empty">Noch keine gemeinsame Runde.</p>';

  let aw = 0, bw = 0, even = 0;
  const num = [], holes = { a: {n:0}, b: {n:0} };
  let hw = 0, hh = 0, hl = 0;
  rs.forEach(m => {
    const pl = pairPlace(m, a, a, b);
    if (pl === 1) aw++; else if (pl === 2) bw++; else even++;
    const ta = totalOf(m, a), tb = totalOf(m, b);
    if (ta != null && tb != null) num.push({ m, ta, tb, pt: parTotal(m) });
    if (m.par && m.scores && m.scores[a] && m.scores[b]) {
      m.par.forEach((par, i) => {
        const x = m.scores[a][i], y = m.scores[b][i];
        [[holes.a, x], [holes.b, y]].forEach(([c, v]) => { c.n++; const k = bucketOf(v, par); c[k] = (c[k] || 0) + 1; });
        if (x < y) hw++; else if (x > y) hl++; else hh++;
      });
    }
  });
  const avg = f => num.length ? sum(num.map(f)) / num.length : null;
  const withPar = num.filter(r => r.pt != null);
  const avgPar = f => withPar.length ? sum(withPar.map(f)) / withPar.length : null;
  const f1 = v => v == null ? '–' : v.toFixed(1).replace('.', ',');
  const fp = v => v == null ? '–' : fmt(v, 1).replace('.', ',');
  const better = (x, y, low) => x == null || y == null || x === y ? ['', ''] : ((x < y) === low ? ['win', 'loss'] : ['loss', 'win']);
  const row = (label, x, y, fx, low) => {
    const [ca, cb] = better(x, y, low);
    return '<tr><td>'+label+'</td><td class="'+ca+'">'+fx(x)+'</td><td class="'+cb+'">'+fx(y)+'</td></tr>';
  };
  const pctf = v => v == null ? '–' : Math.round(100 * v) + ' %';
  const under = c => c.n ? ((c.ace || 0) + (c.under || 0)) / c.n : null;
  const over2 = c => c.n ? ((c.b2 || 0) + (c.b14 || 0)) / c.n : null;
  const ha = holes.a.n ? holes.a : null;

  const table = '<div class="scroll"><table class="duel"><thead><tr><th></th><th>'+esc(a)+'</th><th>'+esc(b)+'</th></tr></thead><tbody>' +
    row('Runden vorn', aw, bw, v => v, false) +
    row('Ø Schläge', avg(r => r.ta), avg(r => r.tb), f1, true) +
    row('Ø zu Par', avgPar(r => r.ta - r.pt), avgPar(r => r.tb - r.pt), fp, true) +
    row('Schläge gesamt', num.length ? sum(num.map(r => r.ta)) : null, num.length ? sum(num.map(r => r.tb)) : null, v => v == null ? '–' : v, true) +
    (ha ? row('Löcher gewonnen', hw, hl, v => v, false) +
      row('Asse', holes.a.ace || 0, holes.b.ace || 0, v => v, false) +
      row('Löcher unter Par', under(holes.a), under(holes.b), pctf, false) +
      row('Löcher +2 und schlechter', over2(holes.a), over2(holes.b), pctf, true) +
      row('14er', holes.a.b14 || 0, holes.b.b14 || 0, v => v, true) : '') +
    '</tbody></table></div>';

  const summary = '<p class="duelsum">'+rs.length+' gemeinsame Runde'+(rs.length>1?'n':'')+' · ' +
    esc(a)+' vorn in '+aw+', '+esc(b)+' in '+bw+(even ? ', '+even+' gleichauf oder offen' : '') +
    (ha ? ' · Löcher '+hw+':'+hl+' bei '+hh+' geteilten' : '') + '</p>';

  // Kumulierter Vorsprung über die gemeinsamen Runden mit Zahlen
  let run = 0;
  const lead = num.map(r => (run += r.tb - r.ta));
  const span = Math.max(10, Math.max(0, ...lead) - Math.min(0, ...lead));
  const step = [5, 10, 20, 25, 50, 100, 200, 250, 500].find(v => span / v <= 5) || 1000;
  const lo = Math.floor(Math.min(0, ...lead) / step) * step, hi = Math.ceil(Math.max(0, ...lead) / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi; v += step) ticks.push(v);
  const chart = num.length >= 2 ? '<p class="charttitle">Vorsprung von '+esc(a)+' in Schlägen, Runde für Runde aufaddiert (unter null: '+esc(b)+' vorn)</p>' +
    lineChart({
      xs: num.map(r => dayLabel(r.m.date)), series: [{ name: a, vals: lead }],
      yTicks: ticks, yPos: v => (v - lo) / ((hi - lo) || 1),
      fmtTick: v => v > 0 ? '+' + v : String(v).replace('-', '−'),
      fmtVal: v => (v > 0 ? '+' : '') + v,
      tipTitle: (lab, i) => lab + ' · ' + num[i].m.map
    }) : '';

  const list = rs.slice().reverse().map(m => {
    const ta = totalOf(m, a), tb = totalOf(m, b), pl = pairPlace(m, a, a, b);
    const d = ta != null && tb != null ? ta - tb : null;
    return '<tr><td><button class="maplink" data-map="'+esc(m.map)+'">'+esc(m.map)+'</button></td>' +
      '<td class="muted">'+dayLabel(m.date)+'</td>' +
      '<td class="'+(pl===1?'win':'')+'">'+(ta == null ? (pl===1?'vorn':'–') : ta)+'</td>' +
      '<td class="'+(pl===2?'win':'')+'">'+(tb == null ? (pl===2?'vorn':'–') : tb)+'</td>' +
      '<td>'+(d == null ? '–' : fmtInt(d))+'</td></tr>';
  }).join('');

  return '<h2>Duell-Vergleich</h2>' + head + summary + table + chart +
    '<details class="tview"'+(rs.length <= 10 ? ' open' : '')+'><summary>Alle '+rs.length+' gemeinsamen Runden</summary><div class="scroll"><table><thead><tr><th>Map</th><th>Tag</th><th>'+esc(a)+'</th><th>'+esc(b)+'</th><th>Differenz</th></tr></thead><tbody>'+list+'</tbody></table></div></details>' +
    '<p class="note">Nur Runden, in denen beide dabei waren, egal wie viele sonst mitgespielt haben. Weil beide dieselben Maps gespielt haben, spielt die Schwierigkeit der Maps keine Rolle. Grün markiert den jeweils besseren Wert. Runden ohne Zahlen zählen nur bei „Runden vorn“.</p>';
}

/* ---------- Duelle ---------- */
function viewDuels() {
  const ps = allPlayers().filter(p => MATCHES.some(m => playersOf(m).includes(p)));
  const head = ps.map(p => '<th>'+esc(p)+'</th>').join('');
  const body = ps.map(a => '<tr'+(a===ME?' class="me"':'')+'><th style="text-align:left">'+esc(a)+'</th>' +
    ps.map(b => {
      if (a === b) return '<td class="self">—</td>';
      const d = duel(a,b);
      if (!d.played) return '<td class="muted">·</td>';
      return '<td class="pick '+(d.aw>d.bw?'win':d.bw>d.aw?'loss':'')+'" data-da="'+esc(a)+'" data-db="'+esc(b)+'" title="Duell '+esc(a)+' gegen '+esc(b)+' öffnen">'+d.aw+':'+d.bw+'</td>';
    }).join('') + '</tr>').join('');
  const mine = ps.filter(p => p !== ME).map(p => {
    const d = duel(ME,p);
    if (!d.played) return '';
    const sd = strokeDuel(ME,p);
    return '<tr><td>'+esc(p)+'</td><td>'+d.played+'</td><td class="'+(d.aw>d.bw?'win':d.aw<d.bw?'loss':'')+'">'+d.aw+':'+d.bw+'</td><td>'+(d.avgDiff==null?'–':fmt(d.avgDiff,1))+'</td>' +
      '<td class="'+(sd.n&&sd.diff<0?'win':sd.n&&sd.diff>0?'loss':'')+'">'+(sd.n?fmtInt(sd.diff):'–')+'</td></tr>';
  }).join('');
  const strokeBody = ps.map(a => '<tr'+(a===ME?' class="me"':'')+'><th style="text-align:left">'+esc(a)+'</th>' +
    ps.map(b => {
      if (a === b) return '<td class="self">—</td>';
      const d = strokeDuel(a,b);
      if (!d.n) return '<td class="muted">·</td>';
      return '<td class="'+(d.diff<0?'win':d.diff>0?'loss':'')+'" title="'+d.sa+' zu '+d.sb+' in '+d.n+' Runden">'+fmtInt(d.diff)+'</td>';
    }).join('') + '</tr>').join('');

  return viewDuelCompare() + '<h2>Duellmatrix</h2><div class="scroll"><table class="matrix"><caption>Zeile gegen Spalte, gelesen als Siege der Zeile zu Siegen der Spalte. Sortiert nach gegnerbereinigter Stärke, Bester oben. Eine Zelle antippen öffnet oben den Duell-Vergleich.</caption><thead><tr><th></th>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>' +
    '<h2>Bilanz von kbb[AH]</h2><div class="scroll"><table><thead><tr><th>Gegner</th><th>Runden</th><th>Siege</th><th>Ø Schlagdifferenz</th><th>Schlagsumme</th></tr></thead><tbody>'+mine+'</tbody></table></div>' +
    '<p class="note">Negative Differenz heißt weniger Schläge im Schnitt. Runden ohne notierte Zahlen zählen für die Bilanz, nicht für die Differenz.</p>' +
    '<h2>Schlagsummen-Duelle</h2><div class="scroll"><table class="matrix">' +
    '<caption>Alle Schläge beider Spieler aus den Runden, in denen beide dabei waren, addiert. Minus heißt: die Zeile brauchte insgesamt weniger Schläge. Das bewertet Konstanz über mehrere Runden statt einzelner Rundensiege.</caption>' +
    '<thead><tr><th></th>'+head+'</tr></thead><tbody>'+strokeBody+'</tbody></table></div>';
}

/* ---------- Maps ---------- */
function viewMaps() {
  if (openMap) return viewMapDetail(openMap);
  const lastPlayed = n => roundsOf(n).reduce((d,m) => m.date > d ? m.date : d, '');
  const byName = (a,b) => a.localeCompare(b,'de');
  const sorters = {
    az: byName,
    oft: (a,b) => roundsOf(b).length - roundsOf(a).length || lastPlayed(b).localeCompare(lastPlayed(a)) || byName(a,b),
    zuletzt: (a,b) => lastPlayed(b).localeCompare(lastPlayed(a)) || byName(a,b)
  };
  const sortBar = '<div class="sortbar">Sortieren: ' + [['az','A–Z'],['oft','am häufigsten'],['zuletzt','zuletzt gespielt']]
    .map(([k,l]) => '<button data-sort="'+k+'" aria-pressed="'+(k===mapSort)+'">'+l+'</button>').join('') + '</div>';
  const rows = mapNames().sort(sorters[mapSort]).map(n => {
    const rs = roundsOf(n), info = mapInfo(n);
    const best = rs.flatMap(m => playersOf(m).map(p => [p, totalOf(m,p)])).filter(x => x[1] != null && !isBot(x[0])).sort((a,b) => a[1]-b[1])[0];
    const meta = rs.length ? (rs.length + ' Runde' + (rs.length>1?'n':'') + (best ? ' · Best ' + best[1] + ' (' + esc(best[0]) + ')' : '')) : 'noch nicht gespielt';
    const type = (rs[0] && rs[0].type) || info.type || 'community';
    return '<button class="maprow'+(rs.length?'':' unplayed')+'" data-map="'+esc(n)+'"><span class="name">'+esc(n)+'</span><span class="meta">'+type+' · '+meta+'</span></button>';
  }).join('');
  return '<h2>Map-Register</h2>'+sortBar+rows+'<p class="note">Auf eine Map tippen für Spielerwerte, Loch-für-Loch-Karten und die Bestenliste.</p>';
}

function viewMapDetail(name) {
  const rs = roundsOf(name), info = mapInfo(name);
  const type = (rs[0] && rs[0].type) || info.type || 'community';
  const pt = rs.length ? parTotal(rs[0]) : null;
  const ps = [...new Set(rs.flatMap(playersOf))];

  const rows = ps.map(p => {
    const mine = rs.filter(m => playersOf(m).includes(p));
    const totals = mine.map(m => totalOf(m,p)).filter(t => t != null);
    const sts = mine.map(m => holeStats(m,p)).filter(Boolean);
    const best = totals.length ? Math.min(...totals) : null;
    const avg = totals.length ? sum(totals)/totals.length : null;
    const avgSd = sts.length ? sum(sts.map(s => s.sd))/sts.length : null;
    const worst = sts.length ? Math.max(...sts.map(s => s.worst)) : null;
    const wins = mine.filter(m => winnersOf(m).includes(p)).length;
    return '<tr'+(p===ME?' class="me"':'')+'><td>'+esc(p)+'</td><td>'+mine.length+'</td><td>'+wins+'</td>' +
      '<td>'+(best==null?'–':best)+'</td><td>'+(avg==null?'–':avg.toFixed(1))+'</td>' +
      '<td>'+(best!=null&&pt!=null?fmtInt(best-pt):'–')+'</td>' +
      '<td>'+(avgSd==null?'–':avgSd.toFixed(2))+'</td><td>'+(worst==null?'–':fmtInt(worst))+'</td></tr>';
  }).join('');

  const blocks = rs.map(m => {
    let out = '';
    if (m.par && m.scores) {
      const head = m.par.map((_,i) => '<th>'+(i+1)+'</th>').join('');
      const parRow = m.par.map(v => '<td class="muted">'+v+'</td>').join('');
      const body = Object.keys(m.scores).map(p => '<tr'+(p===ME?' class="me"':'')+'><td>'+esc(p)+'</td>' +
        m.scores[p].map((v,i) => '<td class="'+(v<m.par[i]?'win':v>m.par[i]?'loss':'')+'">'+v+'</td>').join('') +
        '<td><strong>'+totalOf(m,p)+'</strong>'+(adjOf(m,p)?' <span class="muted">('+fmtInt(adjOf(m,p))+')</span>':'')+'</td></tr>').join('');
      out += '<h3>Loch für Loch · '+dayLabel(m.date)+'</h3><div class="scroll flush"><table class="holes"><thead><tr><th>Loch</th>'+head+'<th>Ges</th></tr></thead><tbody><tr><td class="muted">Par</td>'+parRow+'<td class="muted">'+sum(m.par)+'</td></tr>'+body+'</tbody></table></div>';
    }
    if (m.par && m.scores && Object.keys(m.scores).length > 1)
      out += '<p class="charttitle">Verlauf · Schläge hinter dem Führenden nach jedem Loch</p>' + progressChart(m);
    if (m.note) out += '<p class="note">'+esc(m.note)+'</p>';
    if (m.shot) out += '<figure><img loading="lazy" src="img/'+esc(m.shot)+'.jpg" alt="Bestenliste '+esc(name)+'" onerror="this.closest(\'figure\').remove()"><figcaption>Bestenliste im Spiel, '+dayLabel(m.date)+'</figcaption></figure>';
    return out;
  }).join('');

  const grades = info.grades || {};
  const gradeList = Object.keys(grades).length
    ? Object.entries(grades).map(([p,g]) => esc(p)+': '+esc(g)).join(' · ')
    : 'noch keine Bewertung';

  return '<button class="back" id="m-back">← Alle Maps</button>' +
    '<h2 style="margin-top:0">'+esc(name)+'</h2>' +
    '<p class="sub">'+type+(pt!=null?' · Par '+pt:'')+' · '+rs.length+' Runde'+(rs.length===1?'':'n')+'</p>' +
    (info.note ? '<p class="note">'+esc(info.note)+'</p>' : '') +
    '<p class="grade">Bewertungen — '+gradeList+'</p>' +
    (ps.length ? '<h3>Spielerwerte auf dieser Map</h3><div class="scroll"><table><thead><tr><th>Spieler</th><th>Runden</th><th>Siege</th><th>Best</th><th>Ø</th><th>Best zu Par</th><th>Ø Streuung</th><th>schlecht. Loch</th></tr></thead><tbody>'+rows+'</tbody></table></div>' : '<p class="empty">Noch nicht gespielt.</p>') +
    blocks;
}

    const ms = MATCHES.filter(m => playersOf(m).includes(p));

    const wins = ms.filter(m => winnersOf(m).includes(p)).length;
    const places = ms.map(m => placeOf(m,p)).filter(x => x != null);
    const avgPlace = places.length ? sum(places)/places.length : null;
    const sts = ms.map(m => holeStats(m,p)).filter(Boolean);
    const avgSd = sts.length ? sum(sts.map(s => s.sd))/sts.length : null;
    const avgToPar = sts.length ? sum(sts.map(s => s.toPar))/sts.length : null;
    const worst = sts.length ? Math.max(...sts.map(s => s.worst)) : null;

    const rows = ms.map(m => {
      const t = totalOf(m,p), pt = parTotal(m), pl = placeOf(m,p), n = playersOf(m).length;

        '<td>'+(t!=null&&pt!=null?fmtInt(t-pt):'–')+'</td><td>' +

    const av = (PLAYERS[p] && PLAYERS[p].avatar)

      : '<span class="pav pav-none"></span>';

    const stat = (label,val) => '<div class="stat"><span class="sv">'+val+'</span><span class="sl">'+label+'</span></div>';
    const statbar = '<div class="stats">' +

      stat('Stärke', ratingOf(p).toFixed(2)) +
      (avgPlace!=null ? stat('Ø Platz', avgPlace.toFixed(1)) : '') +
      (avgToPar!=null ? stat('Ø zu Par', fmt(avgToPar,1)) : '') +
      (avgSd!=null ? stat('Ø Streuung', avgSd.toFixed(2)) : '') +
      (worst!=null ? stat('schlecht. Loch', fmtInt(worst)) : '') +
      '</div>';

    return '<details class="pcard'+(p===ME?' pme':'')+'" open>' +
      '<summary><span class="prank">'+(i+1)+'</span>'+av+
        '<span class="pname">'+esc(p)+ig+'</span>' +
        '<span class="psum">'+ms.length+' Runden · '+wins+' Siege</span></summary>' +
      statbar +
      '<div class="scroll"><table><thead><tr><th>Map</th><th>Datum</th><th>Ges</th><th>zu Par</th><th>Platz</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      '</details>';
  }).join('');
}

/* ---------- Diagramme ---------- */
// Feste Farbe pro Spieler (geprüft gegen den dunkelgrünen Hintergrund, auch bei Farbsehschwäche)
const PCOLOR = { Max:'#3987e5', Henry:'#d95926', Florian:'#199e70', Ich:'#c98500', Robin:'#d55181', ShiN:'#9085e9', Sencesless:'#e66767' };
const colorOf = p => PCOLOR[p] || '#93a39a';
const CHARTS = {};
let chartSeq = 0;
const chartWidth = () => Math.max(300, Math.min(968, document.querySelector('.wrap').clientWidth - 32));

// Liniendiagramm. series: [{name, vals:[Zahl|null]}], yPos(v) liefert 0..1 (0 = unten)
function lineChart({ xs, series, yTicks, yPos, fmtTick, fmtVal, xTitle, lowIsGood, tipTitle }) {
  const id = 'c' + (++chartSeq), W = chartWidth(), H = 230, L = 38, R = 78, T = 10, B = 30;
  const n = xs.length, pw = W - L - R, ph = H - T - B;
  const x = i => L + (n > 1 ? i * pw / (n - 1) : pw / 2);
  const y = v => T + (1 - yPos(v)) * ph;
  let svg = '';
  yTicks.forEach(v => {
    svg += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="grid"/>' +
      '<text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" class="tick">'+fmtTick(v)+'</text>';
  });
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(pw / 46))));
  xs.forEach((lab, i) => {
    if (i % step && i !== n - 1) return;
    svg += '<text x="'+x(i)+'" y="'+(H-B+16)+'" text-anchor="middle" class="tick">'+esc(lab)+'</text>';
  });
  if (xTitle) svg += '<text x="'+(W-R)+'" y="'+(H-2)+'" text-anchor="end" class="tick">'+esc(xTitle)+'</text>';
  const ends = [];
  series.forEach(s => {
    let d = '', pen = false;
    s.vals.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
      pen = true;
    });
    svg += '<path d="'+d+'" fill="none" stroke="'+colorOf(s.name)+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    s.vals.forEach((v, i) => {
      if (v != null) svg += '<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.5" fill="'+colorOf(s.name)+'" class="dot"/>';
    });
    const last = s.vals.reduce((k, v, i) => v != null ? i : k, -1);
    if (last >= 0) ends.push({ name: s.name, x: x(last), y: y(s.vals[last]) });
  });
  // Namen am Linienende, bei Überlappung auseinanderschieben
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i-1].y < 13) ends[i].y = ends[i-1].y + 13;
  ends.forEach(e => { svg += '<text x="'+(e.x+8)+'" y="'+(e.y+4)+'" class="endlab">'+esc(e.name)+'</text>'; });
  svg += '<line class="xhair" y1="'+T+'" y2="'+(H-B)+'" x1="0" x2="0" visibility="hidden"/>' +
    '<rect class="hit" x="'+L+'" y="0" width="'+pw+'" height="'+H+'" fill="transparent"/>';
  CHARTS[id] = { xs, series, x, n, L, pw, fmtVal, lowIsGood, tipTitle: tipTitle || (s => s) };
  const legend = series.length < 2 ? '' : '<div class="legend">' + series.map(s =>
    '<span><i style="background:'+colorOf(s.name)+'"></i>'+esc(s.name)+'</span>').join('') + '</div>';
  return legend + '<div class="chart" data-chart="'+id+'"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img">'+svg+'</svg><div class="tip" hidden></div></div>';
}

function bindCharts() {
  document.querySelectorAll('[data-chart]').forEach(el => {
    const c = CHARTS[el.dataset.chart], svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xhair');
    const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); };
    el.querySelector('.hit').addEventListener('pointermove', e => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(c.n - 1, Math.round((e.clientX - r.left - c.L) / (c.pw / Math.max(1, c.n - 1)))));
      xh.setAttribute('x1', c.x(i)); xh.setAttribute('x2', c.x(i)); xh.setAttribute('visibility', 'visible');
      const rows = c.series.filter(s => s.vals[i] != null).sort((a, b) => c.lowIsGood ? a.vals[i] - b.vals[i] : b.vals[i] - a.vals[i]);
      tip.innerHTML = '<strong>'+esc(c.tipTitle(c.xs[i], i))+'</strong>' + rows.map(s =>
        '<div><i style="background:'+colorOf(s.name)+'"></i>'+esc(s.name)+'<span>'+c.fmtVal(s.vals[i])+'</span></div>').join('');
      tip.hidden = false;
      const left = c.x(i) + 12 + tip.offsetWidth > r.width ? c.x(i) - 12 - tip.offsetWidth : c.x(i) + 12;
      tip.style.left = Math.max(0, Math.min(left, r.width - tip.offsetWidth)) + 'px';
    });
    el.querySelector('.hit').addEventListener('pointerleave', hide);
  });
}

/* ---------- Statistik ---------- */
const withHoles = () => MATCHES.filter(m => m.par && m.scores);
const pct = (a, n) => n ? Math.round(100 * a / n) : 0;

function formSeries() {
  const days = [...new Set(MATCHES.map(m => m.date))].sort();
  const players = allPlayers().filter(p => roundCount(p) >= 8);
  const snaps = days.map(d => computeRating(MATCHES.filter(m => m.date <= d)));
  return { days, series: players.map(p => ({ name: p, vals: snaps.map(s => s[p] != null ? s[p] : null) })) };
}

function vsField() {
  const acc = {};
  MATCHES.forEach(m => {
    const ps = playersOf(m), t = ps.map(p => totalOf(m, p));
    if (ps.length < 3 || t.some(v => v == null)) return;
    const avg = sum(t) / t.length;
    ps.forEach((p, i) => (acc[p] = acc[p] || []).push(t[i] - avg));
  });
  return Object.entries(acc).map(([p, d]) => ({ p, n: d.length, avg: sum(d) / d.length, best: Math.min(...d) }))
    .sort((a, b) => a.avg - b.avg);
}

const BUCKETS = [
  ['ace', 'Ass', '#8cbcf2'], ['under', 'unter Par', '#3272c4'], ['par', 'Par', '#5d6e65'],
  ['b1', '+1', '#a3504a'], ['b2', '+2 und mehr', '#d9443f'], ['b14', '14er', '#ff9a8f']
];
function bucketOf(x, par) {
  if (x === 1) return 'ace';
  if (x === 14) return 'b14';
  return x < par ? 'under' : x === par ? 'par' : x === par + 1 ? 'b1' : 'b2';
}
function holeSpread() {
  const acc = {};
  withHoles().forEach(m => Object.entries(m.scores).forEach(([p, s]) => {
    const c = acc[p] = acc[p] || { n: 0 };
    s.forEach((x, i) => { c.n++; const k = bucketOf(x, m.par[i]); c[k] = (c[k] || 0) + 1; });
  }));
  return acc;
}

function holeDuel(a, b) {
  let w = 0, h = 0, l = 0;
  withHoles().forEach(m => {
    if (!m.scores[a] || !m.scores[b]) return;
    m.scores[a].forEach((x, i) => { const y = m.scores[b][i]; if (x < y) w++; else if (x > y) l++; else h++; });
  });
  return { w, h, l };
}

// Zwischenstand nach jedem Loch: Schläge hinter dem Führenden
function progressOf(m) {
  const ps = Object.keys(m.scores), cum = {}, behind = {};
  ps.forEach(p => { cum[p] = 0; behind[p] = []; });
  let lead = null, changes = 0;
  const leaders = new Set();
  m.par.forEach((_, i) => {
    ps.forEach(p => cum[p] += m.scores[p][i]);
    const best = Math.min(...ps.map(p => cum[p]));
    ps.forEach(p => behind[p].push(cum[p] - best));
    const L = ps.filter(p => cum[p] === best);
    if (L.length === 1) { if (lead && L[0] !== lead) changes++; lead = L[0]; leaders.add(lead); }
  });
  return { ps, behind, changes, leaders: leaders.size };
}

function viewStats() {
  const nH = withHoles().length;
  const logPos = (lo, hi) => v => (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo));

  const f = formSeries();
  const allV = f.series.flatMap(s => s.vals).filter(v => v != null);
  const lo = Math.min(0.5, ...allV) * 0.9, hi = Math.max(2, ...allV) * 1.1;
  const form = lineChart({
    xs: f.days.map(dayLabel), series: f.series,
    yTicks: [0.125, 0.25, 0.5, 1, 2, 4, 8, 16, 32].filter(v => v >= lo && v <= hi),
    yPos: logPos(lo, hi), fmtTick: v => String(v).replace('.', ','), fmtVal: v => v.toFixed(2).replace('.', ',')
  });

  const field = vsField().map(r => '<tr'+(r.p===ME?' class="me"':'')+'><td>'+esc(r.p)+'</td><td>'+r.n+'</td>' +
    '<td class="'+(r.avg<0?'win':r.avg>0?'loss':'')+'">'+fmt(r.avg,1).replace('.',',')+'</td>' +
    '<td>'+fmt(r.best,1).replace('.',',')+'</td></tr>').join('');

  const spread = holeSpread();
  const spreadPlayers = allPlayers().filter(p => spread[p]);
  const legend = '<div class="legend">' + BUCKETS.map(([, l, c]) => '<span><i style="background:'+c+'"></i>'+l+'</span>').join('') + '</div>';
  const bars = spreadPlayers.map(p => {
    const c = spread[p];
    const segs = BUCKETS.map(([k, l, col]) => c[k] ? '<span style="flex:'+c[k]+';background:'+col+'" title="'+l+': '+pct(c[k],c.n)+' % ('+c[k]+' Löcher)"></span>' : '').join('');
    return '<div class="brow'+(p===ME?' me':'')+'"><span class="bname">'+esc(p)+'</span><span class="bar">'+segs+'</span><span class="bn">'+c.n+'</span></div>';
  }).join('');
  const spreadTable = '<details class="tview"><summary>Als Tabelle</summary><div class="scroll"><table><thead><tr><th>Spieler</th><th>Löcher</th>' +
    BUCKETS.map(([, l]) => '<th>'+l+'</th>').join('') + '</tr></thead><tbody>' +
    spreadPlayers.map(p => { const c = spread[p]; return '<tr'+(p===ME?' class="me"':'')+'><td>'+esc(p)+'</td><td>'+c.n+'</td>' +
      BUCKETS.map(([k]) => '<td>'+pct(c[k]||0,c.n)+' %</td>').join('') + '</tr>'; }).join('') + '</tbody></table></div></details>';

  const mp = allPlayers().filter(p => withHoles().filter(m => m.scores[p]).length >= 5);
  const mpHead = mp.map(p => '<th>'+esc(p)+'</th>').join('');
  const mpBody = mp.map(a => '<tr'+(a===ME?' class="me"':'')+'><th style="text-align:left">'+esc(a)+'</th>' + mp.map(b => {
    if (a === b) return '<td class="self">—</td>';
    const d = holeDuel(a, b);
    if (!d.w && !d.l && !d.h) return '<td class="muted">·</td>';
    return '<td class="'+(d.w>d.l?'win':d.l>d.w?'loss':'')+'" title="'+d.w+' gewonnen, '+d.h+' geteilt, '+d.l+' verloren">'+d.w+':'+d.l+'</td>';
  }).join('') + '</tr>').join('');

  const thrill = withHoles().map(m => {
    const pr = progressOf(m), ts = pr.ps.map(p => totalOf(m, p)).sort((a, b) => a - b);
    return { m, ...pr, margin: ts.length > 1 ? ts[1] - ts[0] : null };
  }).sort((a, b) => b.changes - a.changes || b.leaders - a.leaders || a.margin - b.margin).slice(0, 8);
  const thrillRows = thrill.map(t => '<tr><td><button class="maplink" data-map="'+esc(t.m.map)+'">'+esc(t.m.map)+'</button></td>' +
    '<td class="muted">'+dayLabel(t.m.date)+'</td><td>'+t.changes+'</td><td>'+t.leaders+'</td>' +
    '<td>'+winList(t.m)+'</td>' +
    '<td>'+(t.margin == null ? '–' : t.margin)+'</td></tr>').join('');

  return '<h2>Statistik</h2>' +
    '<p class="note" style="margin-top:-4px">Loch-Auswertungen beruhen auf den '+nH+' Runden mit Lochwerten, von '+MATCHES.length+' insgesamt.</p>' +
    '<h3>Formkurve</h3>' + form +
    '<p class="note">Stärke-Wert nach jedem Spieltag, berechnet aus allen Runden bis dahin. 1 ist der Durchschnitt, 2 heißt doppelt so gute Gewinnchance im direkten Vergleich. Spieler mit mindestens 8 Runden.</p>' +
    '<h3>Schläge gegenüber dem Rundenschnitt</h3><div class="scroll"><table><thead><tr><th>Spieler</th><th>Runden</th><th>Ø</th><th>beste Runde</th></tr></thead><tbody>'+field+'</tbody></table></div>' +
    '<p class="note">Wie viele Schläge man im Schnitt weniger (−) oder mehr (+) brauchte als der Durchschnitt aller Mitspieler derselben Runde. Unabhängig davon, wie schwer die Map ist. Nur Runden mit mindestens 3 Spielern und Zahlen für alle.</p>' +
    '<h3>Loch-Verteilung</h3>' + legend + '<div class="bars">'+bars+'</div>' + spreadTable +
    '<p class="note">Anteil der Löcher nach Ergebnis gegenüber Par. Ass zählt jedes Loch mit einem Schlag, 14er jedes Loch mit der Höchstzahl. Bug-Korrekturen sind eingerechnet.</p>' +
    '<h3>Lochwettspiel</h3><div class="scroll"><table class="matrix"><caption>Einzelne Löcher gewonnen zu verloren, Zeile gegen Spalte, aus allen gemeinsamen Runden mit Lochwerten. Mit der Maus über eine Zelle fahren zeigt auch die geteilten Löcher.</caption><thead><tr><th></th>'+mpHead+'</tr></thead><tbody>'+mpBody+'</tbody></table></div>' +
    '<h3>Spannendste Runden</h3><div class="scroll"><table><thead><tr><th>Map</th><th>Tag</th><th>Führungs&shy;wechsel</th><th>Führende</th><th>Sieger</th><th>Abstand</th></tr></thead><tbody>'+thrillRows+'</tbody></table></div>' +
    '<p class="note">Wie oft die alleinige Führung nach einem Loch wechselte, und wie viele verschiedene Spieler vorn lagen. Abstand: Schläge zwischen Platz 1 und 2. Den Verlauf jeder Runde zeigt die Map-Seite.</p>';
}

function progressChart(m) {
  const pr = progressOf(m);
  const max = Math.max(1, ...pr.ps.flatMap(p => pr.behind[p]));
  const top = Math.ceil(max / 5) * 5;
  const ticks = [0, top / 2, top].filter((v, i, a) => a.indexOf(v) === i && Number.isInteger(v));
  return lineChart({
    xs: m.par.map((_, i) => String(i + 1)), xTitle: 'Loch',
    series: pr.ps.map(p => ({ name: p, vals: pr.behind[p] })),
    yTicks: ticks, yPos: v => 1 - v / top, fmtTick: v => v ? '+' + v : 'vorn',
    fmtVal: v => v ? '+' + v : 'vorn', lowIsGood: true, tipTitle: h => 'Loch ' + h
  });
}

function render() {
  const tabs = [['matches','Runden'],['duels','Duelle'],['maps','Maps'],['players','Spieler'],['stats','Statistik']];
  const view = ({ matches:viewMatches, duels:viewDuels, maps:viewMaps, players:viewPlayers, stats:viewStats })[tab]();
  document.getElementById('root').innerHTML =
    '<h1>Minigolf-Buch<span class="ro">nur lesen</span></h1>' +
    '<p class="sub">' + MATCHES.length + ' Runden · Golf With Your Friends</p>' +
    '<nav>' + tabs.map(([k,l]) => '<button data-tab="'+k+'" aria-current="'+(k===tab)+'">'+l+'</button>').join('') + '</nav>' +
    view;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.tab));
  document.querySelectorAll('[data-map]').forEach(b => b.onclick = () => go('maps', b.dataset.map));
  document.querySelectorAll('[data-da]').forEach(c => c.onclick = () => { go('duels', null, [c.dataset.da, c.dataset.db]); scrollTo(0,0); });
  ['duel-a','duel-b'].forEach(id => { const el = document.getElementById(id); if (el) el.onchange = () =>
    go('duels', null, [document.getElementById('duel-a').value, document.getElementById('duel-b').value]); });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { mapSort = b.dataset.sort; render(); });
  const tg = document.getElementById('p-toggle');
  if (tg) tg.onclick = e => {
    e.stopPropagation();
    const cards = [...document.querySelectorAll('.pcard')];
    const anyOpen = cards.some(c => c.open);
    cards.forEach(c => c.open = !anyOpen);
    tg.textContent = anyOpen ? 'alle aufklappen' : 'alle zuklappen';
  };
  const back = document.getElementById('m-back');
  if (back) back.onclick = () => go('maps');
  bindCharts();
  lastW = chartWidth();
}

// Diagramme bei geänderter Breite neu zeichnen
let lastW = 0, resizeT = null;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    const w = chartWidth();
    if (w !== lastW && document.querySelector('[data-chart]')) render();
    lastW = w;
  }, 150);
});

window.addEventListener('hashchange', () => {
  readHash();
  render();
  if (openMap) scrollTo(0,0);
});

fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => {
    DATA = d;
    MATCHES = d.matches || [];
    MAPS = d.maps || {};
    PLAYERS = d.players || {};
    const self = Object.keys(PLAYERS).find(p => PLAYERS[p].self);
    if (self) ME = self;
    RATING = computeRating(MATCHES);
    readHash();
    render();
  })
  .catch(e => {
    document.getElementById('root').innerHTML =
      '<h1>Minigolf-Buch</h1><div class="err"><strong>data.json konnte nicht geladen werden.</strong><br>' +
      'Fehler: ' + esc(e.message) + '<br><br>' +
      'Beim Öffnen direkt vom Dateisystem (file://) blockiert der Browser das Laden. ' +
      'Die Seite funktioniert nur über eine echte Adresse, also über GitHub Pages.</div>';
  });
</script>
